<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1e3a8a"
    >

    <meta
        name="description"
        content="Biblia RVR60 - Lectura, búsqueda, notas y proyección"
    >

    <title>Biblia RVR60</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body>

    <!-- =========================================
         MENÚ LATERAL
    ========================================== -->

    <aside
        id="sideMenu"
        class="side-menu"
    >

        <div class="side-menu-header">

            <div class="app-logo">
                📖
            </div>

            <div>
                <strong>Biblia RVR60</strong>
                <small>Biblioteca bíblica</small>
            </div>

        </div>


        <nav class="side-navigation">

            <button
                data-view="reader"
                class="nav-item active"
            >
                <span>📖</span>
                <span>Leer</span>
            </button>


            <button
                data-view="search"
                class="nav-item"
            >
                <span>🔎</span>
                <span>Buscar</span>
            </button>


            <button
                data-view="favorites"
                class="nav-item"
            >
                <span>⭐</span>
                <span>Favoritos</span>
            </button>


            <button
                data-view="notes"
                class="nav-item"
            >
                <span>📝</span>
                <span>Notas</span>
            </button>


            <button
                data-view="history"
                class="nav-item"
            >
                <span>🕘</span>
                <span>Historial</span>
            </button>


            <div class="navigation-separator"></div>


            <button
                data-view="settings"
                class="nav-item"
            >
                <span>⚙️</span>
                <span>Configuración</span>
            </button>


            <button
                data-view="about"
                class="nav-item"
            >
                <span>ℹ️</span>
                <span>Acerca de</span>
            </button>

        </nav>

    </aside>


    <!-- =========================================
         FONDO DEL MENÚ
    ========================================== -->

    <div
        id="overlay"
        class="overlay"
    ></div>


    <!-- =========================================
         APLICACIÓN
    ========================================== -->

    <div class="app">

        <!-- =====================================
             BARRA SUPERIOR
        ====================================== -->

        <header class="top-bar">

            <div class="top-bar-left">

                <button
                    id="menuButton"
                    class="icon-button"
                    aria-label="Abrir menú"
                    title="Menú"
                >
                    ☰
                </button>


                <div class="top-title">

                    <strong>Biblia RVR60</strong>

                    <span>
                        Reina-Valera 1960
                    </span>

                </div>

            </div>


            <div class="top-bar-actions">

                <button
                    id="openSearch"
                    class="icon-button"
                    aria-label="Buscar"
                    title="Buscar"
                >
                    🔎
                </button>

            </div>

        </header>


        <!-- =====================================
             CONTENIDO
        ====================================== -->

        <main
            id="appContent"
            class="app-content"
        >

            <div class="empty-card">

                <div style="font-size:40px;">
                    📖
                </div>

                <h2>
                    Cargando Biblia
                </h2>

                <p id="loadingMessage">
                    Preparando Biblia RVR60...
                </p>

            </div>

        </main>


        <!-- =====================================
             NAVEGACIÓN INFERIOR
        ====================================== -->

        <nav class="bottom-navigation">

            <button
                data-view="reader"
                class="bottom-nav-item active"
            >

                <span>📖</span>

                <small>
                    Leer
                </small>

            </button>


            <button
                data-view="search"
                class="bottom-nav-item"
            >

                <span>🔎</span>

                <small>
                    Buscar
                </small>

            </button>


            <button
                data-view="favorites"
                class="bottom-nav-item"
            >

                <span>⭐</span>

                <small>
                    Favoritos
                </small>

            </button>


            <button
                data-view="notes"
                class="bottom-nav-item"
            >

                <span>📝</span>

                <small>
                    Notas
                </small>

            </button>


            <button
                data-view="settings"
                class="bottom-nav-item"
            >

                <span>⚙️</span>

                <small>
                    Ajustes
                </small>

            </button>

        </nav>

    </div>


    <!-- =========================================
         TOAST
    ========================================== -->

    <div
        id="toast"
        class="toast"
    ></div>


    <!-- =========================================
         SCRIPTS
         
         IMPORTANTE:
         Este orden NO debe cambiar.
    ========================================== -->

    <script src="js/bible-cache.js"></script>

    <script src="js/bible.js"></script>

    <script src="js/app.js"></script>

</body>
</html>
